[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-toolkit"
version = "0.4.1"
description = "Computational Theseus Toolkit — Identity Continuity Guardrails for Agentic Systems"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Hakan Damar" }]
keywords = ["llm", "ai-safety", "identity-continuity", "guardrails", "alignment"]
dependencies = [
    "anyio>=4.14.2", # Fix: process-pool stderr deadlock + TLS IDNA certificate spoofing (Dependabot #67, #68)
    "litellm>=1.104.0", # SQL Injection (CVE-2026-35140) + Auth bypass (CVE-2026-35030) + Cmd exec + SSTI fix + Sandbox escape fix in 1.83.14 + Authenticated SSRF / provider-credential exfiltration via unvalidated request-body routing params fixed in 1.104.0 (Dependabot #70)
    "aiohttp>=3.14.4", # Fix: cross-origin redirect cookie leak + unsafe deserialization (Dependabot #35, #36) + WebSocket/HTTP smuggling/parser (Dependabot #62-64) + DoS/header-timeout/cookie-Secure (Dependabot #74-76)
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "cryptography>=48.0.1",
    "SQLAlchemy>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pyasn1>=0.6.4", # Fix: BER/CER/DER DoS + REAL resource consumption + OID quadratic complexity (Dependabot #58, #59, #61)
    "urllib3>=2.8.0",    # Fix: Decompression-bomb safeguards and sensitive header exposure (Dependabot #30, #31) + HTTPS proxy TLS config + unbounded chunk-size line + Chunked Deflate infinite loop GHSA-gh4c-6fx4-qh6g (Dependabot #69)
    "idna>=3.15",        # Fix: CVE-2024-3651 DoS via idna.encode()
]

[project.urls]
Homepage = "https://theseus-guard.github.io/ct-toolkit/"
Documentation = "https://theseus-guard.github.io/ct-toolkit/"
Repository = "https://github.com/Theseus-Guard/ct-toolkit"
Issues = "https://github.com/Theseus-Guard/ct-toolkit/issues"

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "starlette>=1.3.1", # Fix: CVE-2026-54282/54283 form limits bypass & host header poisoning (Dependabot #39, #41)
    "uvicorn>=0.29.0",
]
cli = [
    "rich>=13.0.0",          # For CLI reporting
    "typer[all]>=0.12.0",
]
observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "langsmith>=0.8.18", # Fix: TracingMiddleware arbitrary file read (GHSA-f4xh-w4cj-qxq8, Dependabot #42)
]
structured = [
    "instructor>=1.3.0",
]
vision = [
    "pillow>=11.3.0",  # Fix: 15+ vulnerabilities incl JPEG2000 DoS, RankFilter OOB, bomb bypass, TGA leak, EPS DoS, etc (Dependabot #44-56)
]
postgres = [
    "psycopg[binary]>=3.1.0",
]
ollama   = ["ollama>=0.2.0"]
langchain = ["langchain-core>=1.3.3"]
# NOTE: Temporarily disabled due to dependency conflict with litellm 1.83.7.
# crewai pins python-dotenv<1.2.0 while litellm==1.83.7 pins python-dotenv==1.0.1.
# Re-enable once crewai releases a version compatible with python-dotenv>=1.2.2.
# To enable: uncomment the line below and run `uv sync --all-extras --dev`
# crewai   = ["crewai>=1.10.0"]
autogen   = ["pyautogen>=0.4.0"]
docs     = ["mkdocs-material>=9.7.7", "pymdown-extensions>=10.21.3"]  # Fix: DOM XSS in search suggestions (Dependabot #66) + path traversal bypass in pymdownx.snippets
ml       = ["torch>=2.13.0", "fastembed>=0.3.0"]  # Fix: memory corruption via torch.jit.script (Dependabot #43)
all = [
    "fastapi>=0.110.0",
    "starlette>=1.3.1",
    "uvicorn>=0.29.0",
    "rich>=13.0.0",
    "typer[all]>=0.12.0",
    "instructor>=1.3.0",
    "pillow>=11.3.0",
    "langsmith>=0.8.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pyright.analysis]
extraPaths = ["."]

[tool.setuptools.packages.find]
include = ["ct_toolkit*"]

[tool.setuptools.package-data]
"ct_toolkit.kernels" = ["*.yaml"]
"ct_toolkit.identity.templates" = ["*.yaml"]
"ct_toolkit" = ["profile_checksums.sha256"]

[project.scripts]
ct-toolkit = "ct_toolkit.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "twine>=6.2.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "pip install build && python -m build"
